<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — EduVerse AR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="auth-subtitle">Choose a new password for your account</p>

    <div id="form-message" class="form-message"></div>

    <form id="reset-form" novalidate>
      <div class="field password-field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" required minlength="6">
        <span class="password-toggle" data-target="new_password">Show</span>
      </div>
      <button type="submit" id="submit-btn" class="btn-primary">Reset password</button>
    </form>

    <p class="auth-footer"><a href="login.html">Back to log in</a></p>
  </div>

  <script src="js/common.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('form-message').textContent = 'No reset token found. Use the link from the forgot password page.';
      document.getElementById('form-message').className = 'form-message error';
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('form-message');
      const submitBtn = document.getElementById('submit-btn');
      const new_password = document.getElementById('new_password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait...';

      const res = await fetch(`${API_BASE}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password })
      });
      const data = await res.json();

      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';

      messageEl.textContent = data.success ? `${data.message} Redirecting to login...` : data.error;
      messageEl.className = `form-message ${data.success ? 'success' : 'error'}`;

      if (data.success) {
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    });

    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', function () {
        const input = document.getElementById(this.dataset.target);
        if (input.type === 'password') {
          input.type = 'text';
          this.textContent = 'Hide';
        } else {
          input.type = 'password';
          this.textContent = 'Show';
        }
      });
    });
  </script>
</body>
</html>
