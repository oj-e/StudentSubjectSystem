<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EduVerse AR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h2>EduVerse AR</h2>
    <div>
      <span id="welcome-text" style="margin-right: 16px; color: var(--text-secondary); font-size: 14px;"></span>
      <button class="btn-secondary" onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="dashboard-content">
    <h3>My Sessions</h3>
    <div id="sessions-list"><p class="empty-state">Loading...</p></div>
    <div id="quiz-panel" style="display:none;">

  <h3>Quiz</h3>
  <div id="quiz-message" class="form-message"></div>
  <div id="quiz-questions"></div>
  <button id="quiz-submit-btn" class="btn-primary" style="max-width:200px;">Submit quiz</button>
</div>

    <h3>My Attendance</h3>
    <div id="attendance-list"><p class="empty-state">Loading...</p></div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const user = requireRole('student');
    if (user) document.getElementById('welcome-text').textContent = `Hi, ${user.name}`;

    async function loadSessions() {
      const container = document.getElementById('sessions-list');
      const data = await authFetch('/sessions/feed');

      if (!data.success || data.sessions.length === 0) {
        container.innerHTML = '<p class="empty-state">No sessions yet. Once your lecturer schedules one, it\'ll show up here.</p>';
        return;
      }

      container.innerHTML = data.sessions.map(s => `
        <div class="session-card">
          <div class="session-info">
            <h4>${s.title} <span class="badge ${s.type === 'live' ? 'badge-live' : 'badge-material'}">${s.type === 'live' ? 'Live' : 'Material'}</span></h4>
            <div class="session-meta">${s.subject_code} — ${s.subject_title} · ${s.lecturer_name}${s.date ? ' · ' + s.date.split('T')[0] : ''}</div>
          </div>
          ${s.type === 'live' ? `<button class="btn-secondary btn-signature" onclick="joinSession(${s.id})" style="color:#fff; border:none;">Join</button>` : ''}
        </div>
      `).join('');
    }

    async function joinSession(sessionId) {
  const data = await authFetch(`/sessions/${sessionId}/attend`, { method: 'POST' });
  showToast(data.success ? data.message : data.error, data.success ? 'success' : 'error');
}

    async function loadAttendance() {
      const container = document.getElementById('attendance-list');
      const data = await authFetch('/sessions/attendance/mine');

      if (!data.success || data.attendance.length === 0) {
        container.innerHTML = '<p class="empty-state">No attendance recorded yet.</p>';
        return;
      }

      container.innerHTML = data.attendance.map(a => `
        <div class="session-card">
          <div class="session-info">
            <h4>${a.title}</h4>
            <div class="session-meta">${a.subject_code} — ${a.subject_title} · joined ${new Date(a.joined_at).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    if (user) {
      loadSessions();
      loadAttendance();
    }

    let currentQuizSessionId = null;

async function openQuiz(sessionId) {
  currentQuizSessionId = sessionId;
  const data = await authFetch(`/quizzes/${sessionId}`);
  const panel = document.getElementById('quiz-panel');
  const container = document.getElementById('quiz-questions');
  const messageEl = document.getElementById('quiz-message');
  messageEl.textContent = '';
  messageEl.className = 'form-message';

  if (!data.success || data.questions.length === 0) {
    container.innerHTML = '<p class="empty-state">No quiz for this session yet.</p>';
    panel.style.display = 'block';
    return;
  }

  container.innerHTML = data.questions.map(q => `
    <div class="field">
      <label>${q.question}</label>
      ${q.options.map(opt => `
        <label style="display:block; font-weight:400; margin-top:6px;">
          <input type="radio" name="q${q.id}" value="${opt}"> ${opt}
        </label>
      `).join('')}
    </div>
  `).join('');

  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('quiz-submit-btn').addEventListener('click', async () => {
  const messageEl = document.getElementById('quiz-message');
  const inputs = document.querySelectorAll('#quiz-questions input[type=radio]:checked');
  const answers = {};
  inputs.forEach(input => {
    const qId = input.name.replace('q', '');
    answers[qId] = input.value;
  });

  const data = await authFetch(`/quizzes/${currentQuizSessionId}/submit`, {
    method: 'POST',
    body: JSON.stringify({ answers })
  });

  if (!data.success) {
    messageEl.textContent = data.error;
    messageEl.className = 'form-message error';
    return;
  }

  messageEl.textContent = `You scored ${data.score} out of ${data.total}`;
  messageEl.className = 'form-message success';
});
  </script>
</body>
</html>
