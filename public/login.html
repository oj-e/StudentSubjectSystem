<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EduVerse AR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to continue to EduVerse AR</p>

    <div id="form-message" class="form-message"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="field password-field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <span class="password-toggle" data-target="password">Show</span>
      </div>

      <button type="submit" id="submit-btn" class="btn-primary">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
