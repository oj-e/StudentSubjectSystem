<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — EduVerse AR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Forgot your password?</h1>
    <p class="auth-subtitle">Enter your email and we'll generate a reset link</p>

    <div id="form-message" class="form-message"></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" id="submit-btn" class="btn-primary">Send reset link</button>
    </form>

    <div id="reset-link-box" style="display:none; margin-top:18px; padding:14px; background:var(--bg); border-radius:8px; font-size:13px; word-break:break-all;">
      <p style="margin-bottom:8px; color:var(--text-secondary);">No email service is set up yet, so here's your reset link directly:</p>
      <a id="reset-link" href="#" style="color:var(--blue); font-weight:600;"></a>
    </div>

    <p class="auth-footer"><a href="login.html">Back to log in</a></p>
  </div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageEl = document.getElementById('form-message');
      const submitBtn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait...';

      const res = await fetch(`${API_BASE}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';

      if (!data.success) {
        messageEl.textContent = data.error;
        messageEl.className = 'form-message error';
        return;
      }

      messageEl.textContent = data.message;
      messageEl.className = 'form-message success';

      if (data.reset_token) {
        const link = `reset-password.html?token=${data.reset_token}`;
        const linkEl = document.getElementById('reset-link');
        linkEl.href = link;
        linkEl.textContent = link;
        document.getElementById('reset-link-box').style.display = 'block';
      }
    });
  </script>
</body>
</html>
